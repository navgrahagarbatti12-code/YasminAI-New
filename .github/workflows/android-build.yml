name: Build Yasmin AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Environment
        run: |
          java -version
          python --version
          gradle -v

      - name: Extract Android Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d android_project
          else
            echo "No ZIP file found, checking root directory..."
            mkdir -p android_project
            cp -r * android_project/ 2>/dev/null || true
          fi

      - name: Verify Android Project
        run: |
          PROJECT_DIR=$(find android_project -name "build.gradle*" -exec dirname {} \; | sort | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Yasmin AI APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Verify APK
        run: |
          APK_PATH=$(find "${{ env.PROJECT_DIR }}" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK successfully built at: $APK_PATH"

      - name: Upload Yasmin AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasmin-AI-Debug-APK
          path: ${{ env.APK_PATH }}

      - name: Build Summary
        run: |
          echo "Yasmin AI APK build completed successfully!" >> $GITHUB_STEP_SUMMARY
