name: Yasmin AI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Yasmin AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/yasmin"

          unzip -oq "$ZIP_FILE" \
            -d "$RUNNER_TEMP/yasmin"

          PROJECT_DIR=$(find "$RUNNER_TEMP/yasmin" \
            -type f -name "settings.gradle.kts" \
            -not -path "*/.gradle/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle project not found in ZIP"
            find "$RUNNER_TEMP/yasmin" -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App module not found"
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          find "$ANDROID_PROJECT_DIR/app/build/outputs" \
            -type f -name "*.apk"

          test -n "$(find \
            "$ANDROID_PROJECT_DIR/app/build/outputs" \
            -type f -name "*.apk" | head -n 1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasmin-AI-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
