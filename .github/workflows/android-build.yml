
name: Build Yasmin AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Yasmin AI APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Setup Android SDK manually
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager not found"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready!"

      # 5. Setup Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Verify Build Environment
      - name: Verify Environment
        run: |
          java -version
          python --version
          gradle --version

      # 7. Extract Android Project ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Android project ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/yasmin-project"

          unzip -oq "$ZIP_FILE" \
            -d "$RUNNER_TEMP/yasmin-project"

          PROJECT_DIR=$(find "$RUNNER_TEMP/yasmin-project" \
            -type f -name "settings.gradle.kts" \
            -not -path "*/.gradle/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App module not found"
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # 8. Verify Android Project
      - name: Verify Android Project
        run: |
          cd "$ANDROID_PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Project verification successful!"

      # 9. Build Debug APK
      - name: Build Yasmin AI APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT_DIR"

          echo "Building Yasmin AI..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload Yasmin AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasmin-AI-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Build Summary
      - name: Build Summary
        if: success()
        run: |
          echo "================================"
          echo "YASMIN AI BUILD SUCCESSFUL"
          echo "APK READY"
          echo "================================"
